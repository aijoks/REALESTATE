<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>First Pioneer Properties — Contact Us</title>
  <meta name="description" content="Contact First Pioneer Properties, Inc., 34-09 Queens Boulevard, Long Island City, New York." />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/transitions.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html"><img src="assets/first-pioneer-logo.svg" alt="First Pioneer Properties, Inc." width="139" height="48" /></a>
      <nav class="main-nav">
        <a href="index.html">Home</a><span class="sep" aria-hidden="true"></span>
        <a href="portfolio.html">Portfolio</a><span class="sep" aria-hidden="true"></span>
        <a href="services.html">Services</a><span class="sep" aria-hidden="true"></span>
        <a href="about.html">About Us</a>
        <a class="nav-cta" href="contact.html">Contact Us</a>
      </nav>
    </div>
  </header>

      <section class="section page-top contact-page">
    <div class="wrap">
      <h2 class="serif-heading">Contact Us</h2>
      <div class="contact-grid">
        <form class="contact-full" id="contact-page-form" novalidate>
          <label>Your Name (required)<input name="name" autocomplete="name" required /></label>
          <label>Your Email (required)<input name="email" type="email" autocomplete="email" required /></label>
          <label>Company<input name="company" autocomplete="organization" /></label>
          <label class="interest" hidden>Property of Interest<input name="property" readonly /></label>
          <label>Subject<input name="subject" /></label>
          <label>Your Message<textarea name="message" rows="9"></textarea></label>
          <label class="robot"><input type="checkbox" name="robot" checked /> UNCHECK this box if you are not a robot.</label>
          <div class="form-row">
            <p class="form-note" id="contact-page-note" role="status"></p>
            <button class="btn send" type="submit">Send</button>
          </div>
        </form>
        <aside class="contact-info">
          <h3>First Pioneer Properties, Inc.</h3>
          <p>34-09 Queens Boulevard<br />3rd Floor<br />Long Island City, New York 11101</p>
          <p>Phone: <a href="tel:+17184820700">718-482-0700</a><br />Fax: 718-482-1380<br />Email:<br /><a class="mail" href="mailto:info@firstpioneerproperties.com">info@firstpioneerproperties.com</a></p>
        </aside>
      </div>
    </div>
  </section>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/contact.js"></script>
</body>
</html>
